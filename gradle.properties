# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx512M
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Environment Properties
# Latest NeoForge 26.2.0.x release verified from the official 26.2.x release history.
# The Minecraft version must agree with the Neo version to get a valid artifact.
minecraft_version=26.2
# Keep the game range exact: this port is validated against the 26.2 rendering and registry APIs.
minecraft_version_range=[26.2]
# Four-segment scheme: 26.2.0.64 = MC 26.2 + NeoForge build 64.
# The 26.2.0-stable marker precedes this build and there is no -beta suffix.
neo_version=26.2.0.64

# Optional 26.2 compatibility compile artifacts, pinned to loader-correct publications.
jei_neoforge_version=30.24.0.176
# CurseForge 8271756 = [NeoForge 26.2] REI 26.2.820.
rei_neoforge_file=8271756
# REI 26.2 source pins Architectury 21.0.2 and Cloth Config 26.2.155.
rei_architectury_version=21.0.2
rei_cloth_config_version=26.2.155
# ZigyTheBird merged Fabric+NeoForge jar: 8674798 = Player Animation Library 1.2.6+26.2.
player_animation_lib_file=8674798
# MrCrayfish Controllable: 8403602 = 0.26.1 NeoForge 26.2.
controllable_neoforge_file=8403602
# Exopandora Shoulder Surfing Reloaded: 8445037 = 5.0.7 NeoForge 26.2.
shoulder_surfing_neoforge_file=8445037

## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
# Keep as "tacz" so existing gun packs' >=1.1.8 dependency checks still resolve.
mod_id=tacz
# The human-readable display name for the mod.
mod_name=Timeless and Classics Zero
# The license of the mod. Review your options at https://choosealicense.com/. All Rights Reserved is the default.
mod_license=GPL-3.0-only
# The mod version. See https://semver.org/
#
# SemVer trap (charter 7.4): MUST use '+' build metadata, NEVER '-' pre-release.
# Gun packs check >=1.1.8; "1.1.8-neoforge..." is a pre-release and sorts BEFORE 1.1.8,
# so the check silently fails. "1.1.8+neoforge..." is build metadata and still satisfies >=1.1.8.
mod_version=1.1.8+neoforge.26.2.R3
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
# See https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=com.tacz.guns

# 26.1+ is unobfuscated. Do not add mappings / parchment / yarn configuration.
