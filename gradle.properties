# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# Sandbox/CI note (2 GiB, cgroup v1): the NeoForm external tools (AutoRenamingTool etc.)
# get no -Xmx from their manifests and default their heap off host RAM, which the OOM
# killer then reaps. Build with JAVA_TOOL_OPTIONS="-Xmx512m -XX:MaxMetaspaceSize=192m"
# in the environment so every spawned tool JVM is capped. (2026-08-22 WP-11211-1.)
org.gradle.jvmargs=-Xmx512M -XX:MaxMetaspaceSize=256m
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Environment Properties
# NeoForge 21.11.x (release channel): https://projects.neoforged.net/neoforged/neoforge
# Verified 2026-08-22 against maven.neoforged.net maven-metadata.xml: the 21.11 line's
# release builds are 21.11.42 / 21.11.44 / 21.11.45 (21.11.43 does not exist).
# The official MDK (NeoForgeMDKs/MDK-1.21.11-ModDevGradle) pins the same 21.11.45.
# The Minecraft version must agree with the Neo version to get a valid artifact.
minecraft_version=1.21.11
# Exact-range discipline, same as the 26.1.2 branch.
minecraft_version_range=[1.21.11]
# Four-segment scheme: 21.11.45 = MC 1.21.11 + NeoForge build 45. No -beta = release.
neo_version=21.11.45

# 1.21.11 is an OBFUSCATED release (unlike 26.1+). Official Mojang mappings are wired
# automatically by ModDevGradle. Do not add mappings / parchment / yarn configuration.

# Optional recipe-viewer compile artifacts, verified 2026-08-22 against live repositories
# (full evidence table: docs/records/PORT_11211_DEPS.md).
jei_neoforge_version=27.30.0.76
# REI moved from CurseMaven to maven.shedaniel.me (RoughlyEnoughItems-neoforge).
rei_neoforge_version=21.11.816
# Architectury (REI transitive): 19.0.1 is the only 1.21.11 build.
rei_architectury_version=19.0.1
# Cloth Config: 21.11.153 is the newest 1.21.11 build.
rei_cloth_config_version=21.11.153
# Compat compile jars for 1.21.11 live in libs/ (build.gradle fileTree escape hatches
# prefer libs/ over remote coordinates; download sources recorded in PORT_11211_DEPS.md):
#   libs/PlayerAnimationLibNeoforge-1.1.9+mc.1.21.11.jar   (PAL, Modrinth neoforge build)
#   libs/controllable-neoforge-1.21.11-0.25.8-signed.jar   (MrCrayfish GitHub release asset)
#   libs/ShoulderSurfing-NeoForge-1.21.11-5.0.10.jar       (SSR, Modrinth neoforge build)

## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
# Keep as "tacz" so existing gun packs' >=1.1.8 dependency checks still resolve.
mod_id=tacz
# The human-readable display name for the mod.
# Brand: "TaCZ: Renovated" (unofficial NeoForge port; naming record: docs/records/NAMING_DECISION.md).
# The modId below must stay "tacz" forever — gun pack dependency checks resolve against it.
mod_name=TaCZ: Renovated
# The license of the mod. Review your options at https://choosealicense.com/. All Rights Reserved is the default.
mod_license=GPL-3.0-only
# The mod version. See https://semver.org/
#
# SemVer trap (charter 7.4): MUST use '+' build metadata, NEVER '-' pre-release.
# Gun packs check >=1.1.8; "1.1.8-neoforge..." is a pre-release and sorts BEFORE 1.1.8,
# so the check silently fails. "1.1.8+neoforge..." is build metadata and still satisfies >=1.1.8.
# WP-11211 (1.21.11 backport): R2（R1-hotfix 之后回传姊妹 1.21.11 线 08-30~09-02 全部修复）。
mod_version=1.1.8+neoforge.1.21.11.R3
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
# See https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=com.tacz.guns
