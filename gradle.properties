# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx512M
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Environment Properties
# Latest NeoForge 26.1.2.x (release channel): https://projects.neoforged.net/neoforged/neoforge
# The Minecraft version must agree with the Neo version to get a valid artifact
minecraft_version=26.1.2
# The Minecraft version range can use any release version of Minecraft as bounds.
# Snapshots, pre-releases, and release candidates are not guaranteed to sort properly
# as they do not follow standard versioning conventions.
minecraft_version_range=[26.1.2]
# The Neo version must agree with the Minecraft version to get a valid artifact.
# Four-segment scheme: 26.1.2.97 = MC 26.1.2 + NeoForge build 97. No -beta = release.
neo_version=26.1.2.97

# Optional recipe-viewer compile artifacts verified against the current 26.1.2 environment.
jei_neoforge_version=29.29.0.77
rei_neoforge_file=8271478
rei_architectury_version=20.0.6
rei_cloth_config_version=26.1.154
# ZigyTheBird Player Animation Library, CurseForge file id (merged Fabric+NeoForge jar).
# 8454167 = 1.2.5+26.1 (26.1.2+2); 8674772 = 1.2.6+26.1 if a newer API line is needed.
player_animation_lib_file=8454167
# MrCrayfish Controllable, CurseForge file id: 7943194 = 0.26.0 NeoForge 26.1.2.
controllable_neoforge_file=7943194
# Exopandora Shoulder Surfing Reloaded, CurseForge file id: 8596489 = 5.0.10 NeoForge 26.1.2.
shoulder_surfing_neoforge_file=8596489

## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
# Keep as "tacz" so existing gun packs' >=1.1.8 dependency checks still resolve.
mod_id=tacz
# The human-readable display name for the mod.
# Brand: "TaCZ: Renovated" (unofficial NeoForge port; naming record: docs/records/NAMING_DECISION.md).
# The modId below must stay "tacz" forever — gun pack dependency checks resolve against it.
mod_name=TaCZ: Renovated
# The license of the mod. Review your options at https://choosealicense.com/. All Rights Reserved is the default.
mod_license=GPL-3.0-only
# The mod version. See https://semver.org/
#
# SemVer trap (charter 7.4): MUST use '+' build metadata, NEVER '-' pre-release.
# Gun packs check >=1.1.8; "1.1.8-neoforge..." is a pre-release and sorts BEFORE 1.1.8,
# so the check silently fails. "1.1.8+neoforge..." is build metadata and still satisfies >=1.1.8.
mod_version=1.1.8+neoforge.26.1.2.R3-hotfix
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
# See https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=com.tacz.guns

# 26.1+ is unobfuscated. Do not add mappings / parchment / yarn configuration.
