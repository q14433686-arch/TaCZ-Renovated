plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files

    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    mavenCentral()
    maven { url "https://jitpack.io" }
    // Optional recipe-viewer compile APIs. Runtime use remains conditional on the
    // corresponding mod being installed by the player.
    maven {
        name = "CurseMaven"
        url = "https://www.cursemaven.com"
    }
    maven {
        name = "Architectury"
        url = "https://maven.architectury.dev"
    }
    maven {
        name = "Shedaniel"
        url = "https://maven.shedaniel.me"
    }
    maven {
        name = "BlameJared"
        url = "https://maven.blamejared.com"
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.11, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    main {
        java {
            // Work package ⑤: compile client animation/gltf APIs.
            // WP-LR2：LR 内置层已接线（安全阀已摘除，LR2-4）。
        }
    }
}

neoForge {
    // enable {} is the ModDevGradle 2.x settings object (ModdingVersionSettings).
    // disableRecompilation skips Vineflower (-Xmx4g by default in neoform-26.1.2-1),
    // which OOMs this 2 GiB sandbox. Dev machines with RAM can set it back to false
    // to get Minecraft sources attached in the IDE.
    enable {
        version = project.neo_version
        disableRecompilation = true
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            // Recommended logging level for the console
            logLevel = org.slf4j.event.Level.INFO

            // Vanilla 26.1.2 ships -Xms2G -Xmx4G. Override for low-memory CI/sandboxes.
            // 1.21.11 backport: 448M is enough for a flat-world dedicated smoke in a 2 GiB sandbox.
            jvmArguments.addAll '-Xms128M', '-Xmx448M', '-XX:MaxMetaspaceSize=192m'
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

// Vendored runtime libs. `implementation files(...)` only puts them on the Gradle
// compile/run classpath — the published mod jar does NOT contain them, so a real
// launcher (PCL / Prism / vanilla NeoForge) crashes at construct:
//   NoClassDefFoundError: org/luaj/vm2/LuaError
//   at ModItems.<clinit> → ModernKineticGunItem (imports LuaError)
//
// ModDevGradle 2 refuses to jarJar a local file that has no JPMS name:
//   Cannot embed local file dependency ... because it has no explicit Java module name.
// Official MDG local-file example stamps Automatic-Module-Name on a Jar task, then
// `jarJar files(thatTask)`. We do the same for the two vendored jars (offline; no
// extra Maven fetch). Filename = artifact-id, MD5 = version.
def jarJarLocalLib = { String jarFileName, String moduleName ->
    def src = layout.projectDirectory.file("libs/${jarFileName}")
    return tasks.register("jarJarPrepare_${moduleName.replace('.', '_')}", Jar) {
        description = "Stamp Automatic-Module-Name=${moduleName} onto ${jarFileName} for FML jarJar"
        from { zipTree(src) }
        exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
        archiveFileName.set(jarFileName)
        destinationDirectory.set(layout.buildDirectory.dir("jarjar-libs"))
        manifest {
            attributes(
                    'Automatic-Module-Name': moduleName,
                    'FMLModType': 'LIBRARY'
            )
        }
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
}

def commonsMath3ForJarJar = jarJarLocalLib('commons-math3-3.6.1.jar', 'org.apache.commons.math3')
def luajForJarJar = jarJarLocalLib('luaj-jse-3.0.1.jar', 'org.luaj.vm2')

dependencies {
    implementation files("libs/commons-math3-3.6.1.jar")
    implementation files("libs/luaj-jse-3.0.1.jar")
    jarJar files(commonsMath3ForJarJar)
    jarJar files(luajForJarJar)

    // Current environment: JEI 27.30.0.76 / REI 21.11.816 for NeoForge 1.21.11
    // (evidence: docs/records/PORT_11211_DEPS.md). These integrations are optional
    // at runtime and are discovered only when the corresponding viewer is present.
    compileOnly "mezz.jei:jei-1.21.11-neoforge:${jei_neoforge_version}"
    compileOnly "me.shedaniel:RoughlyEnoughItems-neoforge:${rei_neoforge_version}"
    compileOnly "dev.architectury:architectury-neoforge:${rei_architectury_version}"
    compileOnly "me.shedaniel.cloth:cloth-config-neoforge:${rei_cloth_config_version}"

    // ZigyTheBird Player Animation Library (PAL) — optional at runtime
    // (modid player_animation_library); drives TACZ third-person gun animations.
    // 1.21.11 pins 1.1.9 (the sibling project's verified 1.21.11 line; 1.2.5 is
    // 26.1-only, and its get3DTransform API differs — see PORT_11211_DEPS.md).
    // Remote coordinates are unusable here: CurseMaven file ids are not resolvable
    // offline, and Modrinth maven cannot express the "+" in the upstream
    // "1.1.9+mc.1.21.11" version string. The jar therefore lives in libs/.
    def localPal = fileTree(dir: 'libs', include: 'PlayerAnimationLibNeoforge*.jar')
    if (!localPal.isEmpty()) {
        compileOnly localPal
    } else {
        throw new GradleException("libs/PlayerAnimationLibNeoforge-1.1.9+mc.1.21.11.jar missing — download from Modrinth (see docs/records/PORT_11211_DEPS.md)")
    }

    // MrCrayfish's Controllable 0.25.8 — optional at runtime (modid controllable);
    // controller bindings + gun-fire rumble. 1.21.11 line: 0.25.8 is the newest
    // NeoForge build (0.26.0 is 26.1-only). Downloaded from the GitHub release
    // asset into libs/ — no configure-time network fetch (r19 lesson: TLS-inspecting
    // proxies broke GitHub fetches at configure time).
    def localControllable = fileTree(dir: 'libs', include: 'controllable-neoforge*.jar')
    if (!localControllable.isEmpty()) {
        compileOnly localControllable
    } else {
        throw new GradleException("libs/controllable-neoforge-1.21.11-0.25.8-signed.jar missing — download from MrCrayfish/Controllable release v1.21.11-0.25.8 (see docs/records/PORT_11211_DEPS.md)")
    }

    // Exopandora's Shoulder Surfing Reloaded 5.x — optional at runtime
    // (modid shouldersurfing). 5.x API only: 4.x builds (also published for
    // 1.21.11) use a legacy plugin API and fail closed at runtime.
    // 1.21.11 line: 1.21.11-5.0.10 is the newest NeoForge build (Modrinth),
    // downloaded into libs/.
    def localShoulderSurfing = fileTree(dir: 'libs', include: 'ShoulderSurfing-NeoForge*.jar')
    if (!localShoulderSurfing.isEmpty()) {
        compileOnly localShoulderSurfing
    } else {
        throw new GradleException("libs/ShoulderSurfing-NeoForge-1.21.11-5.0.10.jar missing — download from Modrinth (see docs/records/PORT_11211_DEPS.md)")
    }
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// Dependency-free regression for the mesh/Iris render-pass boundary. Compile the actual policy
// with a standalone harness; no client, OpenGL context, or additional test library is required.
// 来源：refab 26.1.2 线 commit 9412e08（PR #92，Iris setup 生命周期修复）同形移植。
def meshPassTestClasses = layout.buildDirectory.dir("classes/meshRenderPassTest")
tasks.register("compileMeshRenderPassTest", JavaCompile) {
    source files(
            "src/main/java/cn/sh1rocu/tacz/compat/meshloader/render/MeshRenderPassBatches.java",
            "tests/mesh-render-pass/MeshRenderPassBatchesTest.java")
    classpath = files()
    destinationDirectory = meshPassTestClasses
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
tasks.register("meshRenderPassTest", JavaExec) {
    dependsOn "compileMeshRenderPassTest"
    classpath = files(meshPassTestClasses)
    mainClass = "cn.sh1rocu.tacz.compat.meshloader.render.MeshRenderPassBatchesTest"
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
tasks.named("check") {
    dependsOn "meshRenderPassTest"
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
