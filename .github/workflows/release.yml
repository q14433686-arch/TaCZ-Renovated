# 26.1.2 适配稿；整份复制到 .github/workflows/release.yml 后才会生效。
# 先合入 scripts/verify_release.py / Lua 回归和 RELEASE_NOTES.md，再创建发布 tag。
# 不继承 1.21.11 的 Java 21、R3 版本号或实机 PASS；默认只创建 GitHub 草稿。
# 禁止覆写已有 Release；保留本线的 commit + SHA-256 世代留痕。
name: release

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的本线 tag，须匹配 mod_version（例如 26.1.2_R3）'
        required: true
        type: string
      title:
        description: 'Release 标题（可留空）'
        required: false
        type: string
      draft:
        description: '先创建草稿；取消勾选才直接公开发布（需完成本线实机验收）'
        required: false
        default: true
        type: boolean

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Only accept 26.1.2 release tags
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^26\.1\.2_R[0-9]+([.-][A-Za-z0-9]+)*$ ]] || {
            echo '::error::Expected a 26.1.2_R... tag, not a branch/SHA/other Minecraft version'
            exit 1
          }

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: Release preflight
        run: |
          set -euo pipefail
          bash scripts/check_release_consistency.sh --strict
          python3 scripts/verify_release.py --tag "$TAG"
          python3 -m unittest discover -s scripts/tests -p 'test_release_*.py'

      - name: Refuse to overwrite an existing release (including drafts)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # An API failure must abort, not be mistaken for "release does not exist".
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name' > "$RUNNER_TEMP/release-tags.txt"
          if grep -Fxq "$TAG" "$RUNNER_TEMP/release-tags.txt"; then
            echo '::error::Release already exists; use a new build-metadata version and tag for a hotfix'
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Lua regression
        run: python3 scripts/test_script_globals.py

      - name: Full build
        run: ./gradlew build --console=plain --stacktrace --no-daemon

      - name: L0 release artifact gate
        id: artifact
        run: python3 scripts/verify_release.py --tag "$TAG" --artifact

      - name: Create GitHub release with artifact provenance
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ inputs.title }}
          DRAFT: ${{ inputs.draft }}
          JAR: ${{ steps.artifact.outputs.jar }}
          SHA256: ${{ steps.artifact.outputs.sha256 }}
        run: |
          set -euo pipefail
          COMMIT=$(git rev-parse HEAD)
          REMOTE_COMMIT=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$TAG" --jq .sha)
          [[ "$COMMIT" == "$REMOTE_COMMIT" ]] || { echo '::error::Tag moved during the build'; exit 1; }
          BODY="$RUNNER_TEMP/release-notes.md"
          cp docs/publish/RELEASE_NOTES.md "$BODY"
          printf '\n## 资产世代记录\n\n| UTC 时间 | 构建 commit | 文件 | sha256 |\n|---|---|---|---|\n' >> "$BODY"
          printf '| %s | %s | `%s` | `%s` |\n' "$(date -u +%FT%TZ)" "$COMMIT" "$(basename "$JAR")" "$SHA256" >> "$BODY"
          ARGS=("$TAG" "$JAR" --repo "$GITHUB_REPOSITORY" --verify-tag --notes-file "$BODY"
                --title "${TITLE:-TaCZ: Renovated — $TAG}")
          if [ "$DRAFT" = 'true' ]; then ARGS+=(--draft); fi
          # TAG is positional; gh release create has no --tag-name option.
          gh release create "${ARGS[@]}"
